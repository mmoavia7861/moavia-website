name: Deploy moaviaseo.com to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moaviaseo-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy existing moaviaseo Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production assets for Cloudflare root path
        run: bun run build

      - name: Verify standalone tool pages are in production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/tools/index.html
          test -s dist/tools/meta-title-description-checker/index.html
          test -s dist/tools/json-ld-schema-generator/index.html
          test -s dist/tools/robots-txt-sitemap-generator/index.html
          test -s dist/tools/toolkit.css
          test -s dist/tools/toolkit.js
          test -s dist/sitemap.xml
          test -s sitemap.xml
          test -s robots.txt
          test -s dist/projects/ranknova/index.html
          test -s dist/projects/dark-agency/index.html
          test -s dist/projects/agency-multipage/index.html
          test -s dist/projects/umm-e-aiman/index.html
          test -s dist/moavia-hassan-portrait.webp

      - name: Check deployment credentials in GitHub Secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret."
            echo "Set these in repository Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          # Never print secret values or request headers. Tokens must be a single value,
          # not a copied curl command, quoted text, or multi-line input.
          if [[ "$CF_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN has whitespace or a line break. Replace it with only the raw single-line token, without quotes or curl commands."
            exit 1
          fi
          if [[ ! "$CF_ACCOUNT" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal Account ID (no quotes or whitespace)."
            exit 1
          fi

      - name: Deploy Worker and static assets (preserve dashboard vars)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --keep-vars

      - name: Verify live social image and metadata (diagnostic)
        shell: bash
        run: |
          set +e
          img="https://moaviaseo.com/social-preview.png"
          code=$(curl --max-time 20 --retry 2 -LsS -o /tmp/social-preview.png -w '%{http_code}' "$img")
          mime=$(file -b --mime-type /tmp/social-preview.png 2>/dev/null)
          echo "Preview image: status=$code MIME=$mime"
          if [[ "$code" == "200" && "$mime" == "image/png" ]]; then
            python3 -c "import struct; b=open('/tmp/social-preview.png','rb').read(24); print('Size:',struct.unpack('>II',b[16:24]))"
          else
            echo "::warning::Social preview image could not be fetched publicly"
          fi
          curl --max-time 20 --retry 2 -LsS -o /tmp/home.html -w 'Homepage: HTTP %{http_code}, MIME %{content_type}\n' https://moaviaseo.com/
          if grep -q 'https://moaviaseo.com/social-preview.png' /tmp/home.html; then
            echo "Homepage exposes the expected social image URL"
          else
            echo "::warning::Homepage social image metadata not confirmed"
          fi
          curl --max-time 20 -LsS -A 'facebookexternalhit/1.1' -o /dev/null -w 'Facebook crawler: HTTP %{http_code}, MIME %{content_type}\n' "$img"
          echo "Checking homepage access for social crawlers and normal browsers"
          for agent in 'facebookexternalhit/1.1' 'Twitterbot/1.0' 'LinkedInBot/1.0' 'Mozilla/5.0'; do
            echo "User-Agent: $agent"
            curl --max-time 20 -LsS -A "$agent" -o /tmp/home-crawler.html -w 'Home HTTP: %{http_code}; Content-type: %{content_type}; Effective URL: %{url_effective}\\n' 'https://moaviaseo.com/'
            if grep -q '<meta property="og:image" content="https://moaviaseo.com/social-preview.png"' /tmp/home-crawler.html; then echo "Open Graph tag detected"; else echo "Open Graph tag NOT detected"; fi
          done
          exit 0

