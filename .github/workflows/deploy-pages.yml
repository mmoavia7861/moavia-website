name: Deploy Moavia SEO Pro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
        run: bun run build

      - name: Verify build and create deployment marker
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Moavia SEO Pro: GitHub Actions Vite production build" > dist/deploy-status.txt
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Wait for GitHub Pages artifact to be indexed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || printf '0')
            if [ "$count" = "1" ]; then
              echo "One Pages artifact is indexed and ready to deploy."
              exit 0
            fi
            echo "Pages artifact indexing pending (matching artifacts: $count; attempt $attempt/15)"
            sleep 5
          done
          echo "::error::Expected exactly one indexed github-pages artifact. Deployment stopped before the Pages API call."
          exit 1

      - name: Deploy compiled website
        id: deployment
        uses: actions/deploy-pages@v4
